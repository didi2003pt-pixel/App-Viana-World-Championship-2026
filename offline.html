<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071f36">
  <title>FPV Arbitragem | Sem ligação</title>
  <style>
    :root{--navy:#071f36;--blue:#0f6ea8;--bg:#f3f7fb;--line:#d9e4ec;--text:#1f2d3d;--muted:#66788a}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#f8fcff,var(--bg));font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
    main{max-width:620px;background:white;border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 45px rgba(7,31,54,.12);padding:28px;text-align:center}img{width:82px;height:82px;border-radius:22px}h1{color:var(--navy);margin:18px 0 8px}p{color:var(--muted);line-height:1.55}.button{display:inline-flex;margin-top:12px;padding:12px 16px;border-radius:12px;background:var(--blue);color:white;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <main>
    <img src="./icons/icon-192.png" alt="FPV">
    <h1>Plataforma temporariamente sem ligação</h1>
    <p>A aplicação está em modo offline. Algumas funções de atualização, sincronização e carregamento poderão estar indisponíveis até a ligação ser restabelecida.</p>
    <a class="button" href="./">Voltar à aplicação</a>
  </main>
</body>
</html>
